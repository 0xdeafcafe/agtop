# Builds golangci-lint with rush's own checks in it (tools/lint):
#   golangci-lint custom        → ./bin/rush-lint
#   ./bin/rush-lint run
version: v2.13.2
name: rush-lint
destination: ./bin
plugins:
  - module: github.com/0xdeafcafe/rush/tools/lint
    import: github.com/0xdeafcafe/rush/tools/lint
    path: ./tools/lint
