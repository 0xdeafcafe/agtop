# rush's linting: ./bin/rush-lint run (build it with golangci-lint custom).
version: "2"

run:
  go: "1.27"
  tests: true

linters:
  default: none
  enable:
    # rush's own (tools/lint): json v2 only, no blocking on the UI
    # goroutine, hot-path allocations, unbounded reads.
    - rush
    # Correctness.
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    # Complexity.
    - gocognit
    - gocyclo
    - nestif
    - maintidx
    # Performance.
    - prealloc
    - perfsprint
    - gocritic
    - makezero
    - mirror
    - unconvert
    - wastedassign
    - copyloopvar
    - intrange
    - modernize
  settings:
    custom:
      rush:
        type: module
        description: rush's own checks (tools/lint)
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 25
    nestif:
      min-complexity: 6
    maintidx:
      under: 20
    gocritic:
      enabled-tags: [performance]
      settings:
        hugeParam:
          sizeThreshold: 256
    perfsprint:
      strconcat: false # a + b over fmt.Sprintf is a style choice here, not a cost
  exclusions:
    paths:
      - tools/lint/testdata
      - plugins/skills/write-rush-plugin/templates

issues:
  # Code as of the json v2 move is the baseline: what's older is left as it
  # is, and anything changed or added from then on is held to all of this.
  new-from-rev: 207d457
  max-issues-per-linter: 0
  max-same-issues: 0
